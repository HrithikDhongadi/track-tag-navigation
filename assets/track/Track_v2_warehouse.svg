<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Warehouse-concrete floor variant. The route geometry is kept identical to Track_v2.svg. -->
<svg width="3000" height="3000" viewBox="0 0 793.74998 793.74998" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deterministic, low-contrast concrete grain. Every background colour is
         far above the line follower's default dark threshold of 110. -->
    <pattern id="concrete" width="31" height="29" patternUnits="userSpaceOnUse">
      <rect width="31" height="29" fill="#d4d8d7"/>
      <circle cx="4" cy="6" r="0.70" fill="#bec5c4" opacity="0.32"/>
      <circle cx="17" cy="4" r="0.45" fill="#eef0ed" opacity="0.72"/>
      <circle cx="26" cy="10" r="0.85" fill="#c3c9c7" opacity="0.24"/>
      <circle cx="9" cy="19" r="0.50" fill="#f0f2ef" opacity="0.65"/>
      <circle cx="22" cy="24" r="0.65" fill="#bec5c4" opacity="0.26"/>
      <path d="M 1 25 L 5 24" stroke="#b7bebb" stroke-width="0.34" opacity="0.22"/>
      <path d="M 19 15 L 23 16" stroke="#f4f5f2" stroke-width="0.32" opacity="0.58"/>
    </pattern>
  </defs>
  <g id="track">
    <rect width="793.75" height="793.75" x="0" y="0" fill="url(#concrete)"/>
    <rect fill="none" stroke="#000000" stroke-width="3.96875" stroke-miterlimit="4"
          width="529.16669" height="529.16669" x="134.27605" y="134.27605"
          rx="66.145836" ry="66.145836"/>
    <rect fill="none" stroke="#1a1a1a" stroke-width="3.96875" stroke-miterlimit="4"
          width="264.58334" height="529.16669" x="134.27605" y="134.27605"
          rx="66.145836" ry="66.145836"/>
    <rect fill="none" stroke="#1a1a1a" stroke-width="3.96875" stroke-miterlimit="4"
          width="264.58334" height="529.16669" x="398.85938" y="134.27605"
          rx="66.145836" ry="66.145836"/>
  </g>
</svg>
